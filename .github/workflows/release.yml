name: Build Windows release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Read version
        shell: pwsh
        run: |
          $v = (Select-String -Path lead_scout/gui.py -Pattern 'VERSION\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          echo "VERSION=$v" >> $env:GITHUB_ENV
      - name: Install
        run: python -m pip install -e ".[dev]" pillow openpyxl nuitka zstandard
      - name: Test
        run: python -m pytest -q
      - name: Build CLI executable (Nuitka, versioned metadata for AV trust)
        shell: pwsh
        run: |
          python -m nuitka --standalone --onefile `
            --output-file=SignalScout-CLI.exe `
            --windows-console-mode=force `
            --windows-icon-from-ico=assets/3sverse_icon.ico `
            --windows-company-name=3SVerse `
            --windows-product-name=SignalScout `
            --windows-file-description="SignalScout CLI - Wireless Retail Lead Scout (www.3sverse.com)" `
            --windows-product-version=$env:VERSION.0 `
            --windows-file-version=$env:VERSION.0 `
            --include-package=lead_scout `
            --include-package=curl_cffi `
            --include-package=openpyxl `
            --assume-yes-for-downloads `
            build_entry.py
          if (!(Test-Path SignalScout-CLI.exe)) { throw "exe missing" }

      # AV-safe variant: standalone (onedir) + zip (no onefile self-extract heuristic).
      - name: Build CLI standalone zip (AV-safe variant)
        shell: pwsh
        run: |
          python -m nuitka --standalone `
            --output-dir=onedir_build `
            --output-filename=SignalScout-CLI.exe `
            --windows-console-mode=force `
            --windows-icon-from-ico=assets/3sverse_icon.ico `
            --windows-company-name=3SVerse `
            --windows-product-name=SignalScout `
            --windows-file-description="SignalScout CLI - Wireless Retail Lead Scout (www.3sverse.com)" `
            --windows-product-version=$env:VERSION.0 `
            --windows-file-version=$env:VERSION.0 `
            --include-package=lead_scout `
            --include-package=curl_cffi `
            --include-package=openpyxl `
            --assume-yes-for-downloads `
            build_entry.py
          $dist = "onedir_build/build_entry.dist"
          if (!(Test-Path "$dist/SignalScout-CLI.exe")) { throw "onedir CLI exe missing" }
          Copy-Item assets/AV-FALSE-POSITIVE-NOTE.txt "$dist/"
          Rename-Item $dist -NewName "SignalScout-CLI"
          Compress-Archive -Path onedir_build/SignalScout-CLI -DestinationPath "SignalScout-CLI-$env:VERSION-win64.zip"
          if (!(Test-Path "SignalScout-CLI-$env:VERSION-win64.zip")) { throw "zip missing" }

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            SignalScout-CLI.exe
            SignalScout-CLI-*-win64.zip
          generate_release_notes: true
