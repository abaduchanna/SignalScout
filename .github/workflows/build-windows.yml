name: Build SignalScout (Windows Setup)

# Studio-branded GUI build shipped as ONE file: SignalScout-Setup.exe.
# The exe bundles the brand art (ring, orb, header logo, icon) and the
# English-only UI. No secrets are embedded - the tool carries no
# credentials by design.
#
# AV strategy (SentinelOne et al.): NO --onefile. Nuitka's onefile
# bootstrap extracts a compiled program DLL (run_gui.dll) into
# %TEMP%\onefile_*\ on EVERY launch, which endpoint security treats as
# a malicious file drop. The standalone (onedir) build is installed
# once into a fixed folder by a NSIS setup - no self-extract, no Temp
# payload. The CLI exe + portable zips were retired in v0.3.5.
# Developed by www.3SVerse.com (c) 2026

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      ["lead_scout/**", "assets/**", "packaging/**", "run_gui.py", ".github/workflows/build-windows.yml", "**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-setup:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Read version
        shell: pwsh
        run: |
          $v = (Select-String -Path lead_scout/gui.py -Pattern 'VERSION\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          echo "VERSION=$v" >> $env:GITHUB_ENV
          echo "building SignalScout $v"

      - name: Install build deps
        run: python -m pip install nuitka pillow mechanicalsoup beautifulsoup4 requests websocket-client openpyxl zstandard

      - name: Build standalone (onedir, Nuitka)
        shell: pwsh
        run: |
          python -m nuitka --standalone `
            --output-dir=onedir_build `
            --output-filename=SignalScout.exe `
            --enable-plugin=tk-inter `
            --windows-console-mode=disable `
            --force-stdout-spec="%TEMP%\SignalScout-stdout.log" `
            --force-stderr-spec="%TEMP%\SignalScout-stderr.log" `
            --windows-icon-from-ico=assets/3sverse_icon.ico `
            --windows-company-name=3SVerse `
            --windows-product-name=SignalScout `
            --windows-file-description="SignalScout - Wireless Retail Lead Scout (www.3sverse.com)" `
            --windows-product-version=$env:VERSION.0 `
            --windows-file-version=$env:VERSION.0 `
            --include-data-files=assets/bg_ring.png=bg_ring.png `
            --include-data-files=assets/bg_orb.png=bg_orb.png `
            --include-data-files=assets/3sverse_logo_header.png=3sverse_logo_header.png `
            --include-data-files=assets/3sverse_icon.ico=3sverse_icon.ico `
            --include-package=lead_scout `
            --include-module=native_chrome `
            --include-package=openpyxl `
            --nofollow-import-to=curl_cffi `
            --assume-yes-for-downloads `
            run_gui.py
          $dist = "onedir_build/run_gui.dist"
          if (!(Test-Path "$dist/SignalScout.exe")) { throw "onedir exe missing" }
          Copy-Item assets/AV-FALSE-POSITIVE-NOTE.txt "$dist/"

      - name: Stage installer payload
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path packaging/dist | Out-Null
          Copy-Item onedir_build/run_gui.dist packaging/dist/SignalScout -Recurse -Force
          if (!(Test-Path "packaging/dist/SignalScout/SignalScout.exe")) { throw "staged payload missing" }

      - name: Build SignalScout-Setup.exe (NSIS)
        shell: pwsh
        run: |
          $nsis = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          if (!(Test-Path $nsis)) { choco install nsis -y --no-progress; $nsis = "${env:ProgramFiles(x86)}\NSIS\makensis.exe" }
          if (!(Test-Path $nsis)) { throw "makensis not found" }
          Set-Location packaging
          & $nsis -V3 signal_scout.nsi
          if (!(Test-Path "SignalScout-Setup.exe")) { throw "setup exe missing" }
          Move-Item SignalScout-Setup.exe ..\SignalScout-Setup.exe -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SignalScout-windows-x64
          path: SignalScout-Setup.exe
          if-no-files-found: error

  release:
    needs: windows-setup
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: SignalScout-windows-x64
          path: dist
      - name: Attach single Setup exe to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/SignalScout-Setup.exe
